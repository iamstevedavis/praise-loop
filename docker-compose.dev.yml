# Development override: hot-reload web (next dev) + source mounts.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# (add --build only after changing Dockerfile.dev). Requires Docker Compose
# 2.24.4+ (uses the `!override` merge tag).
#
# Dependencies live in the shared `node_modules` volume. The `deps` service
# runs first and reinstalls them only when package-lock.json changes, so a
# pull that adds packages needs no rebuild or volume reset.
#
# `:z` on the source mount relabels it for SELinux hosts (Fedora/RHEL), where
# containers otherwise get "Permission denied" on the repo; other hosts ignore it.
# The services use their own dev image names so a dev build never takes the
# published ghcr.io/... names from docker-compose.yml.
#
# Note: `environment` lists replace (not merge with) the base file, so all
# variables are repeated here.
services:
  deps:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "${UID:-1000}:${GID:-1000}"
    command:
      - sh
      - -c
      - >-
        sha256sum -c --status node_modules/.package-lock.sha256 2>/dev/null
        || { echo "package-lock.json changed; running npm ci"; npm ci
        && sha256sum package-lock.json > node_modules/.package-lock.sha256; }
    volumes:
      - .:/app:z
      - node_modules:/app/node_modules
    restart: "no"

  migrate:
    image: praise-loop-dev-worker
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-effective_memory}
    command: ["npm", "run", "db:migrate"]
    # Run migrations from the mounted source so new files apply without a rebuild.
    volumes:
      - .:/app:z
      - node_modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully

  web:
    image: praise-loop-dev-web
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev"]
    # Run as the host user so files written into the bind mount (.next/,
    # public/) stay owned by you, not root. 1000 is the image's `node` user,
    # which also owns the node_modules volume.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-effective_memory}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-}
      - GOOGLE_ANDROID_CLIENT_ID=${GOOGLE_ANDROID_CLIENT_ID:-}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-}
      - OWNER_GENERATION_DAILY_LIMIT=${OWNER_GENERATION_DAILY_LIMIT:-25}
      - MOBILE_MINIMUM_VERSION=${MOBILE_MINIMUM_VERSION:-1.0.0}
      - MOBILE_LATEST_VERSION=${MOBILE_LATEST_VERSION:-}
      - MOBILE_FEATURES=${MOBILE_FEATURES:-}
      # Demo sign-in: only meaningful with next dev; ignored by production builds.
      - MOBILE_DEV_AUTH=${MOBILE_DEV_AUTH:-}
      - EMAIL_TRANSPORT=${EMAIL_TRANSPORT:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    # !override drops the base file's root-owned generated_media volume; dev
    # media lives in ./private-media (gitignored) via the repo mount instead.
    volumes: !override
      - .:/app:z
      - node_modules:/app/node_modules

  worker:
    image: praise-loop-dev-worker
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "worker"]
    # Run as the host user so files written into the bind mount (.next/,
    # public/) stay owned by you, not root. 1000 is the image's `node` user,
    # which also owns the node_modules volume.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-effective_memory}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - EXPO_ACCESS_TOKEN=${EXPO_ACCESS_TOKEN:-}
      - REDIS_URL=redis://redis:6379
      - OWNER_GENERATION_DAILY_LIMIT=${OWNER_GENERATION_DAILY_LIMIT:-25}
      - DRAFT_PIPELINE_INTERVAL_MS=${DRAFT_PIPELINE_INTERVAL_MS:-60000}
      - EMAIL_TRANSPORT=${EMAIL_TRANSPORT:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    # !override drops the base file's root-owned generated_media volume; dev
    # media lives in ./private-media (gitignored) via the repo mount instead.
    volumes: !override
      - .:/app:z
      - node_modules:/app/node_modules

  # Expo dev server for the phone app (Expo Go). It runs on the host network so it can
  # detect the LAN address a phone on the same Wi-Fi reaches (Linux only; set DEV_LAN_IP
  # in .env to override, and scale it to 0 to skip it). Dependencies install into
  # mobile/node_modules on first start, and again whenever mobile/package-lock.json changes.
  mobile:
    image: node:22-bookworm
    network_mode: host
    # A terminal makes Expo print its QR code in the `up` logs, as it does on the host.
    tty: true
    working_dir: /app/mobile
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HOME=/tmp
      - EXPO_NO_TELEMETRY=1
      - DEV_LAN_IP=${DEV_LAN_IP:-}
      - MOBILE_PORT=${MOBILE_PORT:-8081}
    command: ["sh", "/app/mobile/dev-container.sh"]
    volumes:
      - .:/app:z
    depends_on:
      web:
        condition: service_healthy
    restart: "no"

volumes:
  node_modules:
