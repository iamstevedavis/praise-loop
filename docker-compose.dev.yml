# Development override: hot-reload web (next dev) + source mounts.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# (add --build only after changing Dockerfile.dev). Requires Docker Compose
# 2.24.4+ (uses the `!override` merge tag).
#
# Dependencies live in the shared `node_modules` volume. The `deps` service
# runs first and reinstalls them only when package-lock.json changes, so a
# pull that adds packages needs no rebuild or volume reset.
#
# Note: `environment` lists replace (not merge with) the base file, so all
# variables are repeated here.
services:
  deps:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "${UID:-1000}:${GID:-1000}"
    command:
      - sh
      - -c
      - >-
        sha256sum -c --status node_modules/.package-lock.sha256 2>/dev/null
        || { echo "package-lock.json changed; running npm ci"; npm ci
        && sha256sum package-lock.json > node_modules/.package-lock.sha256; }
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-effective_memory}
    command: ["npm", "run", "db:migrate"]
    # Run migrations from the mounted source so new files apply without a rebuild.
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev"]
    # Run as the host user so files written into the bind mount (.next/,
    # public/) stay owned by you, not root. 1000 is the image's `node` user,
    # which also owns the node_modules volume.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-effective_memory}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-}
      - GOOGLE_ANDROID_CLIENT_ID=${GOOGLE_ANDROID_CLIENT_ID:-}
      - OWNER_GENERATION_DAILY_LIMIT=${OWNER_GENERATION_DAILY_LIMIT:-25}
      - MOBILE_MINIMUM_VERSION=${MOBILE_MINIMUM_VERSION:-1.0.0}
      - MOBILE_LATEST_VERSION=${MOBILE_LATEST_VERSION:-}
      - MOBILE_FEATURES=${MOBILE_FEATURES:-}
    # !override drops the base file's root-owned generated_media volume; dev
    # media lives in ./private-media (gitignored) via the repo mount instead.
    volumes: !override
      - .:/app
      - node_modules:/app/node_modules

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "worker"]
    # Run as the host user so files written into the bind mount (.next/,
    # public/) stay owned by you, not root. 1000 is the image's `node` user,
    # which also owns the node_modules volume.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-effective_memory}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REDIS_URL=redis://redis:6379
      - OWNER_GENERATION_DAILY_LIMIT=${OWNER_GENERATION_DAILY_LIMIT:-25}
      - DRAFT_PIPELINE_INTERVAL_MS=${DRAFT_PIPELINE_INTERVAL_MS:-60000}
    # !override drops the base file's root-owned generated_media volume; dev
    # media lives in ./private-media (gitignored) via the repo mount instead.
    volumes: !override
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
